name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/reminder_light/manifest.json)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build integration archive
        run: zip -r reminder_light.zip custom_components/reminder_light

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" reminder_light.zip --generate-notes --verify-tag
